<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Pulse - Eco</title>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ecoGreen: '#22c55e',
                        ecoDark: '#166534',
                        ecoLight: '#f0fdf4',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-ecoLight text-gray-800 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-md border border-gray-100">
        
        <h1 class="text-3xl font-bold text-center mb-2 text-ecoDark tracking-tight">
            Fuel<span class="text-ecoGreen">Pulse</span>
        </h1>
        
        <p class="text-center text-gray-500 mb-8 text-sm">
            Seguimiento de consumo eficiente
        </p>

        <form id="calc-form" class="flex flex-col gap-5">
            
            <div>
                <label class="text-xs text-gray-500 uppercase tracking-wider mb-1 block">
                    Kilometraje actual
                </label>
                <input type="number" id="km" placeholder="Ej: 12500" required
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-ecoGreen focus:ring-1 focus:ring-ecoGreen transition">
            </div>

            <div>
                <label class="text-xs text-gray-500 uppercase tracking-wider mb-1 block">
                    Litros cargados
                </label>
                <input type="number" id="litros" placeholder="Ej: 40" step="0.01" required
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-ecoGreen focus:ring-1 focus:ring-ecoGreen transition">
            </div>

            <button type="submit" 
                class="w-full mt-2 bg-ecoGreen text-white font-medium py-3 rounded-lg hover:bg-ecoDark transition">
                Agregar carga
            </button>
        </form>

        <div class="mt-8">
            <h2 class="text-sm font-medium text-gray-600 mb-3">
                Historial
            </h2>

            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="text-gray-500 border-b">
                        <tr>
                            <th class="py-2">#</th>
                            <th class="py-2">Km</th>
                            <th class="py-2">Litros</th>
                        </tr>
                    </thead>
                    <tbody id="lista-cargas" class="text-gray-700">
                    </tbody>
                </table>
            </div>
        </div>

        <div id="resultado" class="mt-6 text-sm text-gray-700 text-center"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
